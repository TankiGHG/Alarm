<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Monitor</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body class="monitor-body dark-theme">
    <div id="soundUnlockOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); color:#fff; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:9999; cursor:pointer; text-align:center;">
        <div style="font-size:1.5rem; margin-bottom:1rem;">Klicken, um Ton zu aktivieren</div>
        <div style="font-size:0.9rem; opacity:0.7;">(Gong &amp; Sprachansage bei neuem Einsatz)</div>
    </div>
    <div class="monitor-grid-container">
        <!-- Header -->
        <header class="monitor-header">
            <div class="header-brand">
                <div class="brand-emblem"></div>
                <div class="brand-text">
                    <div class="brand-title">Feuerwehr Lengfeld</div>
                    <div class="brand-subtitle">Würzburg &middot; Einsatzleitsystem</div>
                </div>
            </div>
            <div id="statusIndicator" class="status-indicator inactive">AWAITING DISPATCH</div>
            <div class="clocks-container">
                <div class="clock-label">Zeit:</div>
                <div id="clock" class="realtime-clock">00:00:00</div>
                <div class="timer-label">Timer:</div>
                <div id="timer" class="tactical-timer">00:00</div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <div class="main-content-grid">

            <!-- Left Column -->
            <div class="left-column">
                <!-- Alarm Details -->
                <div class="widget alarm-widget">
                    <h2 class="widget-title">Einsatzdetails</h2>
                    <div id="activeAlarmContainer" class="active-alarm-container">
                        <div class="no-alarm-msg">Kein aktiver Einsatz</div>
                    </div>
                </div>

                <!-- Weather -->
                <div class="widget weather-widget">
                    <h2 class="widget-title">Wetter</h2>
                    <div id="weatherContainer" class="weather-container">
                        Wetterdaten werden geladen...
                    </div>
                </div>
            </div>

            <!-- Center Column: Map -->
            <div class="center-column">
                <div class="widget map-widget">
                    <div id="mapContainer" class="map-container"></div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="right-column">
                <!-- Assignments -->
                <div class="widget assignments-widget">
                    <h2 class="widget-title">Fahrzeuge & Status</h2>
                    <div id="assignmentsGrid" class="assignments-grid">
                        <!-- Assignments dynamically injected -->
                    </div>
                </div>

                <!-- Recent Alarms -->
                <div class="widget recent-alarms-widget">
                    <h2 class="widget-title">Letzte Einsätze</h2>
                    <div id="recentAlarmsList" class="recent-alarms-list">
                        <!-- Recent alarms dynamically injected -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Leaflet JS for Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        let timerInterval;
        let clockInterval;
        let activeAlarmTime = null;

        // --- Map Variables ---
        let map;
        let marker;

        function initMap() {
            map = L.map('mapContainer').setView([51.1657, 10.4515], 6); // Default center (Germany)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // Fix map sizing issues if container changes size
            setTimeout(() => { map.invalidateSize(); }, 500);
        }

        async function geocode(query) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
            if (!res.ok) {
                console.error(`Geocoding request failed for "${query}": HTTP ${res.status}`);
                return null;
            }
            const data = await res.json();
            return (data && data.length > 0) ? data[0] : null;
        }

        async function updateMapLocation(locationString) {
            if (!map || !locationString) return;
            try {
                let result = await geocode(locationString);

                // Fallback: full address (street + house number) often fails on Nominatim.
                // Retry with just the last two comma-separated parts (typically "PLZ Stadt").
                if (!result) {
                    const parts = locationString.split(',').map(p => p.trim()).filter(Boolean);
                    if (parts.length > 1) {
                        const fallbackQuery = parts.slice(-2).join(', ');
                        console.warn(`No geocoding result for "${locationString}", retrying with "${fallbackQuery}"`);
                        result = await geocode(fallbackQuery);
                    }
                }

                if (!result) {
                    console.warn(`Could not geocode location: "${locationString}"`);
                    return;
                }

                const lat = parseFloat(result.lat);
                const lon = parseFloat(result.lon);

                if (marker) {
                    marker.setLatLng([lat, lon]);
                } else {
                    marker = L.marker([lat, lon]).addTo(map);
                }
                map.setView([lat, lon], 15);
            } catch (err) {
                console.error("Geocoding failed", err);
            }
        }

        // --- Weather Variables ---
        async function fetchWeather() {
            try {
                // simple open-meteo query for a default location, e.g. Berlin
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current_weather=true');
                const data = await res.json();
                if (data && data.current_weather) {
                    const cw = data.current_weather;
                    document.getElementById('weatherContainer').innerHTML = `
                        <div class="weather-temp">${cw.temperature}°C</div>
                        <div class="weather-wind">Wind: ${cw.windspeed} km/h</div>
                        <div class="weather-dir">Richtung: ${cw.winddirection}°</div>
                    `;
                }
            } catch(e) {
                console.error("Weather failed", e);
            }
        }

        // --- Core Functions ---
        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

        function updateTimer() {
            if (!activeAlarmTime) return;
            const now = new Date();
            let diff = Math.floor((now - activeAlarmTime) / 1000);
            if (diff < 0) diff = 0;
            const mins = Math.floor(diff / 60);
            const secs = diff % 60;
            document.getElementById('timer').innerText = `${pad(mins)}:${pad(secs)}`;
        }

        function parseServerTimestamp(timestamp) {
            // Server stores timestamps as UTC in "YYYY-MM-DD HH:MM:SS" format without a
            // timezone marker. new Date() would otherwise parse that as local time.
            return new Date(timestamp.replace(' ', 'T') + 'Z');
        }

        function startTimer(timestamp) {
            activeAlarmTime = timestamp ? parseServerTimestamp(timestamp) : new Date();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer').innerText = "00:00";
            activeAlarmTime = null;
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        let currentAlarm = null;

        const KEYWORD_ICONS = [
            { match: /ölspur/i, icon: '🛢️' },
            { match: /brand/i, icon: '🔥' },
            { match: /rauch/i, icon: '💨' },
            { match: /person.*such|verm/i, icon: '🔍' },
            { match: /eingeklemmt/i, icon: '⚠️' },
            { match: /baum|ast/i, icon: '🌳' },
            { match: /hvo/i, icon: '🚑' }
        ];

        function iconForKeyword(keyword) {
            const found = KEYWORD_ICONS.find(k => k.match.test(keyword || ''));
            return found ? found.icon : '🚨';
        }

        function renderActiveAlarm(alarm) {
            currentAlarm = alarm;

            const container = document.getElementById('activeAlarmContainer');
            container.innerHTML = `
                <div class="active-alarm-keyword">${iconForKeyword(alarm.keyword)} ${escapeHtml(alarm.keyword)}</div>
                <div class="active-alarm-location">${escapeHtml(alarm.location)}</div>
                <div class="active-alarm-units"><strong>Fahrzeuge:</strong> ${escapeHtml(alarm.units)}</div>
                <div class="active-alarm-raw">${escapeHtml(alarm.raw_text)}</div>
            `;

            const statusInd = document.getElementById('statusIndicator');
            statusInd.innerText = "EINSATZ AKTIV";
            statusInd.classList.remove('inactive');
            statusInd.classList.add('active');

            startTimer(alarm.timestamp);

            if (alarm.location && map) {
                updateMapLocation(alarm.location);
            }
        }

        function renderNoActiveAlarm() {
            currentAlarm = null;
            document.getElementById('activeAlarmContainer').innerHTML = '<div class="no-alarm-msg">Kein aktiver Einsatz</div>';

            const statusInd = document.getElementById('statusIndicator');
            statusInd.innerText = "AWAITING DISPATCH";
            statusInd.classList.remove('active');
            statusInd.classList.add('inactive');

            stopTimer();
        }

        function createRecentAlarmElement(alarm) {
            const div = document.createElement('div');
            div.className = 'recent-alarm-card';
            div.innerHTML = `
                <div class="recent-keyword">${iconForKeyword(alarm.keyword)} ${escapeHtml(alarm.keyword)}</div>
                <div class="recent-location">${escapeHtml(alarm.location)}</div>
                <div class="recent-time">${escapeHtml(alarm.timestamp)}</div>
            `;
            return div;
        }

        const FMS_META = {
            '1': { label: 'Status 1', color: '#2ea043' },
            '2': { label: 'Status 2', color: '#1f6feb' },
            '3': { label: 'Status 3', color: '#d29922' },
            '4': { label: 'Status 4', color: '#d00' },
            '5': { label: 'Status 5', color: '#a371f7' },
            '6': { label: 'Status 6', color: '#555' }
        };

        async function loadAssignments() {
            try {
                const [vehiclesRes, assignmentsRes] = await Promise.all([
                    fetch('/api/vehicles'),
                    fetch('/api/assignments')
                ]);
                if (vehiclesRes.ok && assignmentsRes.ok) {
                    const vehicles = await vehiclesRes.json();
                    const assignments = await assignmentsRes.json();
                    const grid = document.getElementById('assignmentsGrid');
                    grid.innerHTML = '';

                    const crewByVehicle = {};
                    assignments.forEach(a => {
                        if (!crewByVehicle[a.vehicle_id]) crewByVehicle[a.vehicle_id] = [];
                        crewByVehicle[a.vehicle_id].push(a);
                    });

                    vehicles.forEach(v => {
                        const tile = document.createElement('div');
                        tile.className = 'assignment-tile';
                        const meta = FMS_META[String(v.fms_status || '2')] || FMS_META['2'];
                        tile.style.borderLeftColor = meta.color;

                        const header = document.createElement('div');
                        header.style.display = 'flex';
                        header.style.justifyContent = 'space-between';
                        header.style.alignItems = 'center';

                        const vTitle = document.createElement('div');
                        vTitle.className = 'vehicle-title';
                        vTitle.innerText = escapeHtml(v.callsign);
                        header.appendChild(vTitle);

                        const badge = document.createElement('span');
                        badge.innerText = meta.label;
                        badge.style.backgroundColor = meta.color;
                        badge.style.color = '#fff';
                        badge.style.fontSize = '0.75rem';
                        badge.style.fontWeight = 'bold';
                        badge.style.padding = '2px 8px';
                        badge.style.borderRadius = '3px';
                        header.appendChild(badge);

                        tile.appendChild(header);

                        const crew = crewByVehicle[v.id] || [];
                        if (crew.length === 0) {
                            const cRow = document.createElement('div');
                            cRow.className = 'crew-row';
                            cRow.innerText = 'Keine Besatzung zugewiesen';
                            tile.appendChild(cRow);
                        } else {
                            crew.forEach(c => {
                                const cRow = document.createElement('div');
                                cRow.className = 'crew-row';
                                cRow.innerText = `${escapeHtml(c.crew_role)}: ${escapeHtml(c.crew_name)}`;
                                tile.appendChild(cRow);
                            });
                        }

                        grid.appendChild(tile);
                    });

                    if (vehicles.length === 0) {
                        grid.innerHTML = '<div class="no-assignments">Keine Fahrzeuge angelegt</div>';
                    }
                }
            } catch (e) {
                console.error("Failed to load assignments", e);
            }
        }

        async function loadInitialData() {
            try {
                const res = await fetch('/api/alarms');
                if (res.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }
                const alarms = await res.json();

                const recentList = document.getElementById('recentAlarmsList');
                recentList.innerHTML = '';

                const active = alarms.find(a => !a.ended_at);

                if (active) {
                    renderActiveAlarm(active);
                } else {
                    renderNoActiveAlarm();
                }

                alarms.filter(a => a.id !== (active && active.id)).forEach(a => {
                    recentList.appendChild(createRecentAlarmElement(a));
                });

                await loadAssignments();
            } catch (err) {
                console.error("Failed to load initial data", err);
            }
        }

        function playGong() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.4, now + 0.05 + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5 + i * 0.15);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.15);
                    osc.stop(now + 2.6 + i * 0.15);
                });
            } catch (e) {
                console.error('Gong playback failed', e);
            }
        }

        function announceAlarm(alarm) {
            try {
                if (!('speechSynthesis' in window)) return;
                const text = `Einsatzalarm: ${alarm.keyword}. Einsatzort: ${alarm.location}.`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.error('Alarm announcement failed', e);
            }
        }

        function initSSE() {
            const evtSource = new EventSource('/api/stream');
            evtSource.addEventListener('new_alarm', (e) => {
                const newAlarm = JSON.parse(e.data);

                const keywordEl = document.querySelector('.active-alarm-keyword');
                if (keywordEl) {
                    const currentActive = {
                        keyword: keywordEl.innerText,
                        location: document.querySelector('.active-alarm-location').innerText,
                        timestamp: new Date().toISOString()
                    };
                    const recentList = document.getElementById('recentAlarmsList');
                    recentList.prepend(createRecentAlarmElement(currentActive));
                }

                renderActiveAlarm(newAlarm);
                playGong();
                announceAlarm(newAlarm);

                const gridEl = document.querySelector('.monitor-grid-container');
                if (gridEl) {
                    gridEl.classList.remove('alarm-flash');
                    void gridEl.offsetWidth;
                    gridEl.classList.add('alarm-flash');
                    setTimeout(() => gridEl.classList.remove('alarm-flash'), 5000);
                }
            });

            evtSource.addEventListener('alarm_ended', (e) => {
                const data = JSON.parse(e.data);
                if (currentAlarm && currentAlarm.id === data.id) {
                    const recentList = document.getElementById('recentAlarmsList');
                    recentList.prepend(createRecentAlarmElement(currentAlarm));
                    renderNoActiveAlarm();
                }
            });

            evtSource.addEventListener('vehicle_status', () => {
                loadAssignments();
            });

            evtSource.onerror = (err) => {
                console.error("EventSource failed:", err);
            };
        }

        function unlockSound() {
            const overlay = document.getElementById('soundUnlockOverlay');
            if (overlay) overlay.remove();
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                ctx.resume();
            } catch (e) { /* ignore */ }
            if ('speechSynthesis' in window) {
                const primer = new SpeechSynthesisUtterance(' ');
                window.speechSynthesis.speak(primer);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('soundUnlockOverlay');
            if (overlay) overlay.addEventListener('click', unlockSound, { once: true });

            clockInterval = setInterval(updateClock, 1000);
            updateClock();
            try { initMap(); } catch (e) { console.error('Map init failed', e); }
            fetchWeather();
            loadInitialData();
            initSSE();
            setInterval(loadAssignments, 30000);
            setInterval(fetchWeather, 300000); // 5 minutes
        });
    </script>
</body>
</html>
