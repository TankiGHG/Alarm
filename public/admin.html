<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Admin Dashboard</h1>
            <div>
                <a href="/monitor.html" style="margin-right: 1rem;">View Monitor</a>
                <button id="logoutBtn" class="danger">Logout</button>
            </div>
        </div>

        <div class="grid-2">
            <!-- Trigger Alarm -->
            <div class="panel">
                <h2>Manual Alarm Trigger</h2>
                <form id="alarmForm">
                    <select id="a_keyword_preset" style="width: 100%; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; border-radius: 4px; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <option value="">Einsatzstichwort vorauswählen...</option>
                        <option value="Ölspur">Ölspur</option>
                        <option value="HVO-Einsatz">HVO-Einsatz</option>
                        <option value="Personensuche">Personensuche</option>
                        <option value="Brand Container am Schützenhaus">Brand Container am Schützenhaus</option>
                        <option value="Unklare Rauchentwicklung">Unklare Rauchentwicklung</option>
                        <option value="Brand Mülleimer">Brand Mülleimer</option>
                        <option value="Person unter irgendwas eingeklemmt">Person unter irgendwas eingeklemmt</option>
                        <option value="Evtl. Baum/Ast auf Straße">Evtl. Baum/Ast auf Straße</option>
                    </select>
                    <input type="text" id="a_keyword" placeholder="Keyword (e.g. Brand B3)" required>
                    <input type="text" id="a_location" placeholder="Location" required>
                    <input type="text" id="a_units" placeholder="Units (comma separated)" required>
                    <input type="text" id="a_raw" placeholder="Raw Description" required>
                    <input type="number" id="a_delay" placeholder="Delay in minutes (0 for immediate)" min="0" value="0" required style="width: 100%; padding: 0.5rem 0.75rem; margin-bottom: 1rem; border-radius: 4px; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-primary);">
                    <button type="submit">Dispatch Alarm</button>
                </form>
                <div id="activeAlarmBanner" style="display:none; margin-top: 1rem; padding: 0.75rem; border-radius: 4px; background-color: var(--accent-red); color: #fff;">
                    <span id="activeAlarmText"></span>
                    <button id="endAlarmBtn" class="danger" style="margin-left: 1rem;">Einsatz beenden</button>
                </div>
            </div>

            <!-- Manage Vehicles -->
            <div class="panel">
                <h2>Vehicles</h2>
                <form id="vehicleForm" style="display:flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <input type="text" id="v_callsign" placeholder="Callsign (e.g. Florian 1/46/1)" required style="margin-bottom:0">
                    <button type="submit">Add</button>
                </form>
                <ul id="vehicleList"></ul>
            </div>

            <!-- Manage Crew -->
            <div class="panel">
                <h2>Crew Members</h2>
                <form id="crewForm" style="display:flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <input type="text" id="c_name" placeholder="Name" required style="margin-bottom:0">
                    <select id="c_role" style="padding: 0.5rem; border-radius: 4px; background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color);">
                        <option value="Gruppenführer">Gruppenführer (Führer)</option>
                        <option value="Maschinist">Maschinist</option>
                        <option value="Angriffstruppführer">Angriffstruppführer (Führer)</option>
                        <option value="Angriffstruppmann">Angriffstruppmann (Mann)</option>
                        <option value="Wassertruppführer">Wassertruppführer (Führer)</option>
                        <option value="Wassertruppmann">Wassertruppmann (Mann)</option>
                        <option value="Schlauchtruppführer">Schlauchtruppführer (Führer)</option>
                        <option value="Schlauchtruppmann">Schlauchtruppmann (Mann)</option>
                        <option value="Melder">Melder</option>
                    </select>
                    <button type="submit">Add</button>
                </form>
                <ul id="crewList"></ul>
            </div>

            <!-- Manage Assignments -->
            <div class="panel">
                <h2>Crew-Vehicle Assignments</h2>
                <form id="assignmentForm" style="display:flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <select id="a_crew_id" required style="flex: 1; padding: 0.5rem; border-radius: 4px; background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color);">
                        <option value="">Select Crew...</option>
                    </select>
                    <select id="a_vehicle_id" required style="flex: 1; padding: 0.5rem; border-radius: 4px; background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color);">
                        <option value="">Select Vehicle...</option>
                    </select>
                    <button type="submit">Assign</button>
                </form>
                <ul id="assignmentList"></ul>
            </div>
        </div>
    </div>

    <script>
        let vehiclesData = [];
        let crewData = [];

        async function fetchAPI(url, options = {}) {
            const res = await fetch(url, options);
            if (res.status === 401) window.location.href = '/login.html';
            return res;
        }

        async function loadVehicles() {
            const res = await fetchAPI('/api/vehicles');
            vehiclesData = await res.json();
            const list = document.getElementById('vehicleList');
            const select = document.getElementById('a_vehicle_id');
            list.innerHTML = '';
            select.innerHTML = '<option value="">Select Vehicle...</option>';
            vehiclesData.forEach(v => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerText = escapeHtml(v.callsign);
                list.appendChild(li);

                const opt = document.createElement('option');
                opt.value = v.id;
                opt.innerText = escapeHtml(v.callsign);
                select.appendChild(opt);
            });
        }

        async function loadCrew() {
            const res = await fetchAPI('/api/crew');
            crewData = await res.json();
            const list = document.getElementById('crewList');
            const select = document.getElementById('a_crew_id');
            list.innerHTML = '';
            select.innerHTML = '<option value="">Select Crew...</option>';
            crewData.forEach(c => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.style.display = 'flex';
                li.style.justifyContent = 'space-between';
                li.innerHTML = `<span>${escapeHtml(c.name)} (${escapeHtml(c.role)})</span>
                                <button class="danger" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;" onclick="deleteCrew(${c.id})">Remove</button>`;
                list.appendChild(li);

                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = `${escapeHtml(c.name)} (${escapeHtml(c.role)})`;
                select.appendChild(opt);
            });
        }

        async function deleteCrew(id) {
            await fetchAPI(`/api/crew/${id}`, { method: 'DELETE' });
            loadCrew();
            loadAssignments();
        }

        // Utility for escaping HTML to prevent XSS
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        async function loadAssignments() {
            const res = await fetchAPI('/api/assignments');
            const data = await res.json();
            const list = document.getElementById('assignmentList');
            list.innerHTML = '';
            data.forEach(a => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.style.display = 'flex';
                li.style.justifyContent = 'space-between';
                li.innerHTML = `<span><strong>${escapeHtml(a.crew_name)}</strong> (${escapeHtml(a.crew_role)}) &rarr; <strong>${escapeHtml(a.vehicle_callsign)}</strong></span>
                                <button class="danger" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;" onclick="deleteAssignment(${a.id})">Remove</button>`;
                list.appendChild(li);
            });
        }

        async function deleteAssignment(id) {
            await fetchAPI(`/api/assignments/${id}`, { method: 'DELETE' });
            loadAssignments();
        }

        document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const callsign = document.getElementById('v_callsign').value;
            await fetchAPI('/api/vehicles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ callsign })
            });
            document.getElementById('v_callsign').value = '';
            loadVehicles();
        });

        document.getElementById('crewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('c_name').value;
            const role = document.getElementById('c_role').value;
            await fetchAPI('/api/crew', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, role })
            });
            document.getElementById('c_name').value = '';
            loadCrew();
        });

        document.getElementById('assignmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const crew_id = document.getElementById('a_crew_id').value;
            const vehicle_id = document.getElementById('a_vehicle_id').value;
            await fetchAPI('/api/assignments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ crew_id, vehicle_id })
            });
            document.getElementById('assignmentForm').reset();
            loadAssignments();
        });

        document.getElementById('a_keyword_preset').addEventListener('change', (e) => {
            if (e.target.value) {
                document.getElementById('a_keyword').value = e.target.value;
            }
        });

        document.getElementById('alarmForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const keyword = document.getElementById('a_keyword').value;
            const location = document.getElementById('a_location').value;
            const units = document.getElementById('a_units').value;
            const raw_text = document.getElementById('a_raw').value;
            const delay = document.getElementById('a_delay').value;

            const res = await fetchAPI('/api/alarms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keyword, location, units, raw_text, delay })
            });

            document.getElementById('alarmForm').reset();

            if (res.ok) {
                const data = await res.json();
                if (data.scheduled) {
                    alert(`Alarm scheduled to dispatch in ${delay} minutes.`);
                } else {
                    alert('Alarm dispatched immediately!');
                }
                loadActiveAlarm();
            } else {
                alert('Failed to dispatch alarm');
            }
        });

        let activeAlarmId = null;

        async function loadActiveAlarm() {
            const res = await fetchAPI('/api/alarms');
            const alarms = await res.json();
            const active = alarms.find(a => !a.ended_at);

            const banner = document.getElementById('activeAlarmBanner');
            if (active) {
                activeAlarmId = active.id;
                document.getElementById('activeAlarmText').innerText = `Aktiver Einsatz: ${active.keyword} (${active.location})`;
                banner.style.display = 'block';
            } else {
                activeAlarmId = null;
                banner.style.display = 'none';
            }
        }

        document.getElementById('endAlarmBtn').addEventListener('click', async () => {
            if (!activeAlarmId) return;
            await fetchAPI(`/api/alarms/${activeAlarmId}/end`, { method: 'POST' });
            loadActiveAlarm();
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetchAPI('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        loadVehicles();
        loadCrew();
        loadAssignments();
        loadActiveAlarm();
    </script>
</body>
</html>
