<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alert System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="panel login-box">
            <h2>System Login</h2>
            <form id="loginForm">
                <label for="password" style="display:block; margin-bottom: 0.5rem;">Admin Password</label>
                <input type="password" id="password" required>
                <div id="errorMsg" style="color: var(--accent-red); margin-bottom: 1rem; display: none;">Invalid credentials</div>
                <button type="submit" style="width: 100%">Authenticate</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    window.location.href = '/monitor.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
